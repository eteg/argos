openapi: 3.1.0
info:
  title: Argos API
  version: 0.3.0
  summary: Contrato entre a web e a API do Argos, M1 mais health e diagnóstico da IA.
  description: >-
    Fonte da verdade do contrato. As camadas de texto estão em docs/contratos:
    convenções, recursos, operações e telas. Todo nome é em inglês e camelCase.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3001
    description: API local
security:
  - apiKey: []
tags:
  - name: Health
    description: Estado da API.
  - name: Engineer
    description: Engenheiro configurado no ambiente e configuração.
  - name: Sites
    description: Obras, equipamentos, documentos e serviços.
  - name: Entries
    description: Mídia e registros do dia.
  - name: OpenItems
    description: Itens em aberto entre os dias.
  - name: Reports
    description: RDO, perguntas do agente e aprovação.
  - name: AI
    description: Diagnóstico da IA.
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Estado da API e do banco
      security: []
      responses:
        "200":
          description: A API e o banco respondem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              examples:
                ok: { $ref: "#/components/examples/HealthOk" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/me:
    get:
      operationId: getMe
      tags: [Engineer]
      summary: Engenheiro configurado no ambiente
      parameters:
        - $ref: "#/components/parameters/XTimezone"
      responses:
        "200":
          description: O engenheiro.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engineer" }
              examples:
                rafael: { $ref: "#/components/examples/Engineer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/config:
    get:
      operationId: getConfig
      tags: [Engineer]
      summary: Limites que as regras deixam no ambiente
      parameters:
        - $ref: "#/components/parameters/XTimezone"
      responses:
        "200":
          description: A configuração.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
              examples:
                default: { $ref: "#/components/examples/Config" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/diagnostics/ai:
    post:
      operationId: runAiDiagnostic
      tags: [AI]
      summary: Faz uma chamada de teste à IA
      parameters:
        - $ref: "#/components/parameters/XTimezone"
      responses:
        "200":
          description: A resposta da IA e o consumo da chamada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiDiagnostic" }
              examples:
                ok: { $ref: "#/components/examples/AiDiagnostic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`AI_DISABLED`: a IA está desligada neste ambiente (`AI_ENABLED=false`)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites:
    get:
      operationId: listSites
      tags: [Sites]
      summary: Lista as obras
      description: >-
        Sem `status`, só `in_progress`. Ordena pela distância quando vem
        `X-Device-Location`.
      parameters:
        - $ref: "#/components/parameters/XTimezone"
        - $ref: "#/components/parameters/XDeviceLocation"
        - name: status
          in: query
          description: Lista de `siteStatus` separada por vírgula.
          schema: { type: string }
          example: not_started,paused,completed
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Obras resumidas.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SiteSummary" }
              examples:
                nearby: { $ref: "#/components/examples/SiteList" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createSite
      tags: [Sites]
      summary: Cadastra uma obra
      description: >-
        A obra nasce `in_progress` (D02). `location` é opcional: sem ela, a API
        busca pelo endereço (D09). `publicContract` é obrigatório em `public` e
        `financed`, e ignorado em `private`.
      parameters:
        - $ref: "#/components/parameters/XTimezone"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
            examples:
              private: { $ref: "#/components/examples/CreateSiteRequest" }
      responses:
        "201":
          description: A obra criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
              examples:
                created: { $ref: "#/components/examples/Site" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/XTimezone"
    get:
      operationId: getSite
      tags: [Sites]
      summary: A obra inteira, mais o que a pasta da obra mostra
      responses:
        "200":
          description: A obra.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
              examples:
                vilaVerde: { $ref: "#/components/examples/SiteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateSite
      tags: [Sites]
      summary: Edita a obra
      description: Vale pros RDOs montados depois. Os já montados guardam a cópia do dia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteRequest" }
            examples:
              rename: { value: { name: "Residencial Vila Verde · Bloco B" } }
      responses:
        "200":
          description: A obra atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
              examples:
                updated: { $ref: "#/components/examples/Site" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/status:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/XTimezone"
    put:
      operationId: changeSiteStatus
      tags: [Sites]
      summary: Muda o status da obra
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeSiteStatusRequest" }
            examples:
              complete: { value: { status: completed } }
      responses:
        "200":
          description: A obra com o novo status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
              examples:
                changed: { $ref: "#/components/examples/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            A obra tem RDO não aprovado e não pode ser concluída (`RG08`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                openReports: { $ref: "#/components/examples/SiteHasOpenReports" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/services:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/XTimezone"
    get:
      operationId: listServices
      tags: [Sites]
      summary: Lista os serviços da planilha da obra
      parameters:
        - name: search
          in: query
          description: Parte do código ou da descrição.
          schema: { type: string }
      responses:
        "200":
          description: Até 200 serviços, por código.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    put:
      operationId: importServices
      tags: [Sites]
      summary: Importa a planilha de serviços da obra
      description: >-
        Substitui a lista de serviços. Aceita `.xlsx` e `.csv` até 10 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentEncoding: base64, description: A planilha. }
      responses:
        "200":
          description: A quantidade importada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportServicesResult" }
              examples:
                imported: { value: { servicesCount: 148, servicesFileName: planilha-vila-verde.xlsx } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/FileTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFile" }
        "422":
          description: A planilha não tem código e descrição.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                unreadable: { $ref: "#/components/examples/SpreadsheetUnreadable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/equipment:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/XTimezone"
    post:
      operationId: addEquipment
      tags: [Sites]
      summary: Adiciona um equipamento à obra
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EquipmentRequest" }
            examples:
              guindaste: { value: { name: Guindaste 30 t, identifier: ABC-1D23 } }
      responses:
        "201":
          description: O equipamento criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
              examples:
                created: { $ref: "#/components/examples/Equipment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/equipment/{equipmentId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/EquipmentId"
      - $ref: "#/components/parameters/XTimezone"
    patch:
      operationId: updateEquipment
      tags: [Sites]
      summary: Edita um equipamento da obra
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEquipmentRequest" }
            examples:
              rename: { value: { name: Betoneira 2 } }
      responses:
        "200":
          description: O equipamento atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Equipment" }
              examples:
                updated: { $ref: "#/components/examples/Equipment" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: removeEquipment
      tags: [Sites]
      summary: Remove um equipamento da obra
      description: Some dos RDOs seguintes, não dos já montados.
      responses:
        "204":
          description: Removido.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/documents:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/XTimezone"
    post:
      operationId: uploadSiteDocument
      tags: [Sites]
      summary: Envia um documento da obra
      description: PDF ou imagem, até 50 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file: { type: string, contentEncoding: base64 }
                type: { $ref: "#/components/schemas/DocumentType" }
      responses:
        "201":
          description: O documento criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDocument" }
              examples:
                created: { $ref: "#/components/examples/SiteDocument" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/FileTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFile" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/XTimezone"
    patch:
      operationId: updateSiteDocument
      tags: [Sites]
      summary: Troca o tipo de um documento da obra
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteDocumentRequest" }
            examples:
              retype: { value: { type: structural } }
      responses:
        "200":
          description: O documento atualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDocument" }
              examples:
                updated: { $ref: "#/components/examples/SiteDocument" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: removeSiteDocument
      tags: [Sites]
      summary: Remove um documento da obra
      responses:
        "204":
          description: Removido.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        description: UUID gerado na web.
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/XTimezone"
    put:
      operationId: uploadMedia
      tags: [Entries]
      summary: Envia um áudio ou uma foto
      description: >-
        Um arquivo por chamada. Se o mesmo `mediaId` chegar de novo, a API
        devolve o que já foi gravado, com 200. Áudio até 10 MB, foto até 15 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind, source, capturedAt]
              properties:
                file: { type: string, contentEncoding: base64 }
                kind: { $ref: "#/components/schemas/MediaKind" }
                source: { $ref: "#/components/schemas/MediaSource" }
                capturedAt: { type: string, format: date-time }
                location: { $ref: "#/components/schemas/Location" }
                durationSeconds: { type: integer, description: "Duração do áudio, medida na web." }
            encoding:
              location: { contentType: application/json }
      responses:
        "200":
          description: A mídia já existia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
              examples:
                photo: { $ref: "#/components/examples/MediaPhoto" }
        "201":
          description: A mídia gravada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
              examples:
                photo: { $ref: "#/components/examples/MediaPhoto" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/FileTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedFile" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/entries:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/XTimezone"
    post:
      operationId: createEntry
      tags: [Entries]
      summary: Salva um registro do dia
      description: >-
        Um áudio e até 3 fotos já enviados por `uploadMedia`. No M1 o registro
        ainda não passa pela IA e responde 201; a partir do M2 vira operação
        demorada e responde 202. Se o mesmo `id` chegar de novo, devolve o que
        já foi gravado, com 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEntryRequest" }
            examples:
              withPhotos: { $ref: "#/components/examples/CreateEntryRequest" }
      responses:
        "202":
          description: >-
            O registro gravado e em interpretação (`status` `processing`). A web consulta
            `getEntry` até `processed` ou `failed`. Sem IA ligada no ambiente, responde 201.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "200":
          description: O registro já existia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
              examples:
                entry: { $ref: "#/components/examples/Entry" }
        "201":
          description: O registro gravado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
              examples:
                entry: { $ref: "#/components/examples/Entry" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: O estado atual impede o registro.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                siteNotInProgress: { $ref: "#/components/examples/SiteNotInProgress" }
                photoLimitEntry: { $ref: "#/components/examples/PhotoLimitEntry" }
                photoLimitReport: { $ref: "#/components/examples/PhotoLimitReport" }
                reportAlreadyApproved: { $ref: "#/components/examples/ReportAlreadyApproved" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/days/{localDate}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - name: localDate
        in: path
        required: true
        schema: { type: string, format: date }
        example: "2026-11-25"
      - $ref: "#/components/parameters/XTimezone"
    get:
      operationId: getDay
      tags: [Entries]
      summary: O dia de uma obra
      responses:
        "200":
          description: Os registros do dia, os itens em aberto e o RDO, se existir.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Day" }
              examples:
                today: { $ref: "#/components/examples/Day" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/pending-days:
    get:
      operationId: listPendingDays
      tags: [Entries]
      summary: Dias anteriores que ficaram sem RDO aprovado
      description: >-
        Uma linha por obra em andamento, com os dias anteriores a hoje que têm registro e ainda não
        têm RDO aprovado, do mais antigo pro mais novo. Só o mais antigo da obra é o próximo (`isNext`),
        porque os dias são fechados em ordem (D04).
      parameters:
        - $ref: "#/components/parameters/XTimezone"
        - $ref: "#/components/parameters/XDeviceLocation"
      responses:
        "200":
          description: Os dias pendentes por obra.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PendingDaysGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/open-items:
    get:
      operationId: listOpenItems
      tags: [OpenItems]
      summary: Lista os itens em aberto, de todas as obras
      description: >-
        Sem `status`, só os abertos, do mais antigo pro mais novo. Com `closed`, do fechado mais
        recentemente pro mais antigo. `closedSince` só vale com `closed`. Só entra o que foi
        aprovado num RDO (`F1RN11`). `mentionedToday` vem sempre `null` aqui; o resumo do dia
        (`getDay`) e a pasta da obra (`getSite`) preenchem.
      parameters:
        - $ref: "#/components/parameters/XTimezone"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OpenItemStatus" }
        - name: closedSince
          in: query
          description: Só fechados desde esta data (inclusive).
          schema: { type: string, format: date }
        - name: siteId
          in: query
          description: Só os itens desta obra.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Os itens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OpenItem" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/XTimezone"
    get:
      operationId: getEntry
      tags: [Entries]
      summary: Um registro, com o que a IA entendeu
      responses:
        "200":
          description: O registro.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/questions/{questionId}/answer:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/XTimezone"
    post:
      operationId: answerQuestion
      tags: [Reports]
      summary: Responde uma pergunta do agente
      description: >-
        Com `optionId` ou `text` responde 200. Com `audioMediaId` responde 202: a API transcreve o áudio, guarda a transcrição em `answer.text` e aplica a resposta do mesmo jeito que a digitada, no campo da pergunta (`field`) quando ele aceita texto; em campo estruturado, ou se o texto não serve para o campo, a transcrição fica só na pergunta. O `audioMediaId` precisa ser um áudio enviado por `uploadMedia` (senão 400 `VALIDATION` no campo `audioMediaId`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerQuestionRequest" }
      responses:
        "200":
          description: A pergunta respondida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "202":
          description: A resposta falada está sendo transcrita; a web consulta o RDO para ver a resposta aplicada.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Question" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`AI_DISABLED`: resposta falada com a IA desligada neste ambiente. Responda com `optionId` ou `text`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/days/{localDate}/report:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - name: localDate
        in: path
        required: true
        schema: { type: string, format: date }
      - $ref: "#/components/parameters/XTimezone"
    post:
      operationId: generateReport
      tags: [Reports]
      summary: Monta ou remonta o rascunho do RDO do dia
      description: >-
        Chamar de novo remonta o rascunho com os registros novos. A API guarda quais campos o engenheiro
        corrigiu à mão (`updateReport`, resposta a pergunta ou correção falada): esses ficam como estão, e a
        IA recalcula todo o resto a partir de todos os registros do dia, inclusive listas inteiras (atividades,
        ocorrências, efetivo). Com IA ligada, responde 202 com `status` `generating`; a web consulta
        `getReport` até `draft`. Cada lacuna obrigatória vira pergunta (`RG05`). Enquanto a IA monta, o
        rascunho guarda o conteúdo anterior. Uma montagem presa há mais de 5 minutos pode ser substituída:
        gerar de novo, corrigir à mão ou aprovar encerra a montagem antiga, e o resultado dela é descartado.
      responses:
        "202":
          description: O RDO em `generating`.
          headers:
            Location: { schema: { type: string } }
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`PREVIOUS_DAY_PENDING`, `REPORT_ALREADY_APPROVED` ou `NO_ENTRIES` (o dia não tem registro)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/XTimezone"
    get:
      operationId: getReport
      tags: [Reports]
      summary: Um RDO
      responses:
        "200":
          description: O RDO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateReport
      tags: [Reports]
      summary: Corrige à mão campos do rascunho do RDO
      description: >-
        Manda só os campos que mudam. A lista inteira de um campo substitui a anterior.
        `site` e `localDate` não mudam (vêm do cadastro e do dia). Em `photos` vão só
        `id`, `caption` e `linkedTo`. Entra no `history`. Chamar `generateReport`
        de novo mantém essas correções.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateReportRequest" }
      responses:
        "200":
          description: O RDO com os campos novos e `missingFields` recalculado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`REPORT_ALREADY_APPROVED` ou `REPORT_NOT_READY` (o RDO ainda está sendo montado)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/reports/{reportId}/voice-corrections:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/XTimezone"
    post:
      operationId: correctReportByVoice
      tags: [Reports]
      summary: Corrige o rascunho falando
      description: >-
        O áudio sobe antes por `uploadMedia` e precisa ser `audio` (senão 400 `VALIDATION` no campo `audioMediaId`). A API transcreve, aplica a correção e volta o RDO
        a `draft`; o histórico registra a correção. Se não der pra aplicar, o RDO volta a `draft`
        sem mudança e o histórico diz o motivo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioMediaId]
              properties:
                audioMediaId: { type: string, format: uuid }
                section: { type: string, description: "Bloco em foco, como `workday` ou `activities`." }
      responses:
        "202":
          description: O RDO em `generating`. A web consulta `getReport` até `draft`.
          headers:
            Location: { schema: { type: string } }
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`REPORT_ALREADY_APPROVED`, `REPORT_NOT_READY` ou `AI_DISABLED` (a IA está desligada neste ambiente)."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/reports/{reportId}/pdf:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/XTimezone"
    get:
      operationId: getReportPdf
      tags: [Reports]
      summary: Baixa o PDF do RDO aprovado
      description: >-
        Só do RDO aprovado. O nome sugerido vem em `Content-Disposition`, como
        `RDO-088_VilaVerde_25-11.pdf`. Leva `X-Api-Key` como as outras rotas, então a web
        baixa por `fetch` e não por link direto.
      responses:
        "200":
          description: O PDF.
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`REPORT_NOT_APPROVED`: o RDO ainda não foi aprovado."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/sites/{siteId}/reports:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/XTimezone"
    get:
      operationId: listReports
      tags: [Reports]
      summary: Lista os RDOs aprovados da obra
      description: Do mais novo pro mais antigo, com cursor.
      parameters:
        - name: status
          in: query
          description: Só `approved` por enquanto.
          schema: { type: string, enum: [approved] }
        - name: limit
          in: query
          description: Padrão 20, máximo 50.
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          description: O `nextCursor` da página anterior.
          schema: { type: string }
      responses:
        "200":
          description: Uma página de RDOs.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReportListItem" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/reports/{reportId}/approve:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/XTimezone"
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveReport
      tags: [Reports]
      summary: Aprova o RDO
      description: >-
        Grava o responsável e o instante (`F1RN05`), dá o número sequencial da obra e aplica o desfecho dos itens em aberto (`F1RN11`).
        Repetir a chamada com a mesma chave, inclusive em paralelo, devolve o RDO já aprovado com 200. A web gera uma chave por RDO
        e reaproveita a mesma até a aprovação dar certo. Um dia anterior da obra com registro e sem RDO aprovado bloqueia a aprovação
        (D04), para o número seguir a ordem das datas (D11).
      responses:
        "200":
          description: O RDO aprovado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`REPORT_INCOMPLETE`, com `errors` apontando cada campo que falta (`RG06`), `REPORT_ALREADY_APPROVED` com outra chave, `REPORT_NOT_READY` ou `PREVIOUS_DAY_PENDING`, com `errors[].field` nas datas dos dias anteriores sem RDO aprovado."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Chave do ambiente. Protege só de acesso casual (ADR 0002).
  parameters:
    XTimezone:
      name: X-Timezone
      in: header
      required: true
      description: Fuso IANA do celular. A API usa pra calcular "hoje".
      schema: { type: string }
      example: America/Sao_Paulo
    XDeviceLocation:
      name: X-Device-Location
      in: header
      description: "`lat,lng`, só quando a pessoa permitiu a localização."
      schema: { type: string }
      example: "-19.9319,-44.0539"
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 5b1f0a52-6d0e-4a55-9a0b-1d4c2f6e8a01
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 7c2d9e10-3b4a-4f6e-8d21-0a9b8c7d6e51
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9d3e0f21-4c5b-4a7f-9e32-1b0a9c8d7e62
  responses:
    Unauthorized:
      description: Sem chave ou com chave errada.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unauthorized: { $ref: "#/components/examples/Unauthorized" }
    Validation:
      description: Campo inválido.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            validation: { $ref: "#/components/examples/Validation" }
    NotFound:
      description: O recurso não existe.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            notFound: { $ref: "#/components/examples/NotFound" }
    FileTooLarge:
      description: Arquivo acima do limite do upload.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            fileTooLarge: { $ref: "#/components/examples/FileTooLarge" }
    UnsupportedFile:
      description: Tipo de arquivo não aceito.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unsupportedFile: { $ref: "#/components/examples/UnsupportedFile" }
    RateLimited:
      description: Acima do limite de chamadas.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            rateLimited: { $ref: "#/components/examples/RateLimited" }
    Unavailable:
      description: Falha da API.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unavailable: { $ref: "#/components/examples/Unavailable" }
  schemas:
    Problem:
      type: object
      description: Problem Details (RFC 9457) com `code` estável.
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
    Health:
      type: object
      required: [status, environment, version, database]
      properties:
        status: { type: string, enum: [ok] }
        environment: { type: string }
        version: { type: string, description: O commit. }
        database: { type: string, enum: [up] }
    AiDiagnostic:
      type: object
      required: [model, output, inputTokens, outputTokens, cacheReadInputTokens, cacheCreationInputTokens, latencyMs, traceId]
      properties:
        model: { type: string }
        output: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cacheReadInputTokens: { type: integer }
        cacheCreationInputTokens: { type: integer }
        latencyMs: { type: integer }
        traceId: { type: string }
    Location:
      type: object
      required: [lat, lng, accuracyMeters]
      properties:
        lat: { type: number }
        lng: { type: number }
        accuracyMeters: { type: [number, "null"] }
    LocationInput:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
        accuracyMeters: { type: number }
    SiteType: { type: string, enum: [private, public, financed] }
    SiteStatus: { type: string, enum: [not_started, in_progress, paused, completed] }
    DocumentType:
      type: string
      enum: [architectural, structural, plumbing, electrical_telecom, hvac, fire_protection, as_built]
    EntryStatus: { type: string, enum: [processing, processed, failed] }
    MediaKind: { type: string, enum: [audio, photo] }
    MediaSource: { type: string, enum: [camera, microphone] }
    DayState: { type: string, enum: [no_entries, in_progress, draft, approved] }
    ReportStatus: { type: string, enum: [generating, draft, approved] }
    OpenItemKind: { type: string, enum: [declared_pending, unresolved_occurrence, unfinished_service] }
    OpenItemStatus: { type: string, enum: [open, closed] }
    QuestionKind: { type: string, enum: [missing_field, open_item, service_match, safety] }
    QuestionStatus: { type: string, enum: [open, answered] }
    TagKind: { type: string, enum: [activity, occurrence, labor, equipment, weather, safety] }
    Engineer:
      type: object
      required: [id, name, title, company]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        company: { type: string }
    Config:
      type: object
      required: [maxPhotosPerEntry, minPhotosPerReport, maxPhotosPerReport, openItemHighlightDays, geofenceRadiusMeters]
      properties:
        maxPhotosPerEntry: { type: integer }
        minPhotosPerReport: { type: integer }
        maxPhotosPerReport: { type: integer }
        openItemHighlightDays: { type: integer }
        geofenceRadiusMeters: { type: integer }
    Party:
      type: object
      required: [name, taxId]
      properties:
        name: { type: string }
        taxId: { type: string, description: CNPJ. }
    TechnicalManager:
      type: object
      required: [name, artNumber]
      properties:
        name: { type: string }
        artNumber: { type: string }
    Amendment:
      type: object
      required: [id, description, addedDays, signedOn]
      properties:
        id: { type: string }
        description: { type: string }
        addedDays: { type: integer }
        signedOn: { type: string, format: date }
    AmendmentInput:
      type: object
      required: [description, addedDays, signedOn]
      properties:
        description: { type: string }
        addedDays: { type: integer }
        signedOn: { type: string, format: date }
    PublicContract:
      type: object
      required: [number, commitmentOrAgreement, inspectorName, serviceOrderDate, durationDays, amendments, elapsedDays, remainingDays]
      properties:
        number: { type: string }
        commitmentOrAgreement: { type: string }
        inspectorName: { type: string }
        serviceOrderDate: { type: string, format: date }
        durationDays: { type: integer }
        amendments:
          type: array
          items: { $ref: "#/components/schemas/Amendment" }
        elapsedDays: { type: integer, description: Calculado pela API. }
        remainingDays: { type: integer, description: Calculado pela API. }
    PublicContractInput:
      type: object
      required: [number, commitmentOrAgreement, inspectorName, serviceOrderDate, durationDays]
      properties:
        number: { type: string }
        commitmentOrAgreement: { type: string }
        inspectorName: { type: string }
        serviceOrderDate: { type: string, format: date }
        durationDays: { type: integer }
        amendments:
          type: array
          items: { $ref: "#/components/schemas/AmendmentInput" }
    Equipment:
      type: object
      required: [id, name, identifier]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        identifier: { type: [string, "null"], description: Prefixo ou placa. }
    EquipmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        identifier: { type: [string, "null"] }
    UpdateEquipmentRequest:
      type: object
      properties:
        name: { type: string }
        identifier: { type: [string, "null"] }
    SiteDocument:
      type: object
      required: [id, fileName, type, url]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        type: { $ref: "#/components/schemas/DocumentType" }
        url: { type: string, description: Link temporário pra abrir. }
    UpdateSiteDocumentRequest:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/DocumentType" }
    Service:
      type: object
      required: [id, code, description, unit]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
        unit: { type: [string, "null"] }
    ImportServicesResult:
      type: object
      required: [servicesCount, servicesFileName]
      properties:
        servicesCount: { type: integer }
        servicesFileName: { type: string }
    DaySummary:
      type: object
      required: [localDate, state, entriesCount, reportId]
      properties:
        localDate: { type: string, format: date }
        state: { $ref: "#/components/schemas/DayState" }
        entriesCount: { type: integer }
        reportId: { type: [string, "null"] }
    PendingDay:
      type: object
      description: Dia anterior a hoje com registro e sem RDO aprovado, capturado com ou sem internet. Bloqueia o RDO dos dias seguintes (D04).
      required: [localDate, entriesCount, offline]
      properties:
        localDate: { type: string, format: date }
        entriesCount: { type: integer }
        offline: { type: boolean, description: Algum registro do dia foi capturado sem internet. }
    PendingDayDetail:
      type: object
      required: [localDate, entriesCount, audiosCount, photosCount, offline, isNext]
      properties:
        localDate: { type: string, format: date }
        entriesCount: { type: integer }
        audiosCount: { type: integer }
        photosCount: { type: integer }
        offline: { type: boolean, description: Algum registro do dia foi capturado sem internet. }
        isNext: { type: boolean, description: "`true` só no dia mais antigo da obra." }
    PendingDaysGroup:
      type: object
      required: [site, days]
      properties:
        site: { $ref: "#/components/schemas/SiteSummary" }
        days:
          type: array
          items: { $ref: "#/components/schemas/PendingDayDetail" }
    OpenItem:
      type: object
      required: [id, siteId, title, kind, status, openedOn, openedInReportId, lastUpdate, closedOn, closingNote, mentionedToday]
      properties:
        id: { type: string }
        siteId: { type: string }
        title: { type: string }
        kind: { $ref: "#/components/schemas/OpenItemKind" }
        status: { $ref: "#/components/schemas/OpenItemStatus" }
        openedOn: { type: string, format: date }
        openedInReportId: { type: string }
        lastUpdate:
          type: [object, "null"]
          required: [localDate, note]
          properties:
            localDate: { type: string, format: date }
            note: { type: string }
        closedOn: { type: [string, "null"], format: date }
        closingNote: { type: [string, "null"] }
        mentionedToday:
          type: [object, "null"]
          description: Só no resumo do dia.
          required: [entryId, capturedAt]
          properties:
            entryId: { type: string }
            capturedAt: { type: string, format: date-time }
    RecentReport:
      type: object
      required: [id, number, localDate, approvedAt, occurrencesCount]
      properties:
        id: { type: string }
        number: { type: integer }
        localDate: { type: string, format: date }
        approvedAt: { type: string, format: date-time }
        occurrencesCount: { type: integer }
    Site:
      type: object
      required: [id, name, type, status, statusChangedOn, address, location, client, contractor, technicalManager, publicContract, servicesCount, servicesFileName, equipment, documents, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/SiteType" }
        status: { $ref: "#/components/schemas/SiteStatus" }
        statusChangedOn: { type: [string, "null"], format: date }
        address: { type: string }
        location:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
        client: { $ref: "#/components/schemas/Party" }
        contractor: { $ref: "#/components/schemas/Party" }
        technicalManager: { $ref: "#/components/schemas/TechnicalManager" }
        publicContract:
          oneOf:
            - $ref: "#/components/schemas/PublicContract"
            - type: "null"
        servicesCount: { type: integer }
        servicesFileName: { type: [string, "null"] }
        equipment:
          type: array
          items: { $ref: "#/components/schemas/Equipment" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/SiteDocument" }
        createdAt: { type: string, format: date-time }
    SiteSummary:
      type: object
      required: [id, name, type, status, statusChangedOn, address, location, servicesCount, distanceMeters, today, pendingDays, openItemsCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/SiteType" }
        status: { $ref: "#/components/schemas/SiteStatus" }
        statusChangedOn: { type: [string, "null"], format: date }
        address: { type: string }
        location:
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
        servicesCount: { type: integer }
        distanceMeters: { type: [integer, "null"], description: Com `X-Device-Location`. }
        today: { $ref: "#/components/schemas/DaySummary" }
        pendingDays:
